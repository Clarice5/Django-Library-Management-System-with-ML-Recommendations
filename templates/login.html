<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library LMS | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(10, 15, 30, 0.55), rgba(10, 15, 30, 0.65)),
                url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=2000&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            font-family: Arial, sans-serif;
            color: white;
        }

        .login-card {
    width: 90%;
    max-width: 400px;

    padding: 40px;

    background: rgba(255, 255, 255, 0.06);

    border: 1px solid rgba(255, 255, 255, 0.20);
    border-radius: 20px;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);

    text-align: center;
}

        .logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .login-card h1 {
            font-size: 30px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 30px;
        }

        .form-control {
            height: 50px;

            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 10px;

            color: white;

            margin-bottom: 15px;

            padding-left: 15px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            color: white;

            border-color: rgba(255, 255, 255, 0.6);

            box-shadow: none;
        }

        .login-btn {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 10px;

            margin-top: 10px;

            background: white;
            color: #182033;

            font-size: 16px;
            font-weight: bold;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .footer {
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo"></div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to your Library
        </p>

        <form method="post" action="/login">

            {% csrf_token %}

            <input
                type="text"
                id="username"
                class="form-control"
                name="username"
                placeholder="Username"
                required
                autofocus
            >

            <input
                type="password"
                id="inputPassword"
                class="form-control"
                name="password"
                placeholder="Password"
                required
            >

            <button class="login-btn" type="submit">
                Sign In
            </button>

        </form>

        <div class="footer">
            Library Management System
        </div>

    </div>

</body>
</html>
