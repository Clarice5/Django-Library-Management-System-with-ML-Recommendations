{% extends 'base.html' %}

{% block title %}Edit Book{% endblock %}

{% block body %}

<style>

    .edit-container {
        max-width: 650px;
        margin: 45px auto;
    }

    .edit-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .edit-header h2 {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .edit-header p {
        color: rgba(255,255,255,0.6);
    }

    .edit-card {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px;
        padding: 35px;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    }

    .form-group-custom {
        margin-bottom: 20px;
    }

    .form-group-custom label {
        display: block;
        margin-bottom: 7px;
        color: rgba(255,255,255,0.7);
        font-size: 14px;
    }

    .custom-input {
        width: 100%;
        height: 46px;

        background: rgba(255,255,255,0.07);

        border: 1px solid rgba(255,255,255,0.15);

        border-radius: 9px;

        color: white;

        padding: 0 14px;
    }

    .custom-input:focus {
        outline: none;
        border-color: rgba(255,255,255,0.4);
        background: rgba(255,255,255,0.10);
    }

    .button-row {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    .update-btn {
        flex: 1;
        height: 48px;

        border: none;
        border-radius: 10px;

        background: white;
        color: #111827;

        font-weight: 600;

        transition: 0.25s;
    }

    .update-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .cancel-btn {
        flex: 1;
        height: 48px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 10px;
    }

</style>


<div class="container page-container">

    <div class="edit-container">

        <div class="edit-header">

            <h2>✏️ Edit Book</h2>

            <p>
                Update the details of this book
            </p>

        </div>


        <div class="edit-card">

            <form method="POST">

                {% csrf_token %}


                <div class="form-group-custom">

                    <label>Title</label>

                    <input
                        type="text"
                        name="title"
                        class="custom-input"
                        value="{{ book.title }}"
                        required>

                </div>


                <div class="form-group-custom">

                    <label>Author</label>

                    <input
                        type="text"
                        name="author"
                        class="custom-input"
                        value="{{ book.author }}"
                        required>

                </div>


                <div class="form-group-custom">

                    <label>Category</label>

                    <input
                        type="text"
                        name="category"
                        class="custom-input"
                        value="{{ book.category }}"
                        required>

                </div>


                <div class="form-group-custom">

                    <label>Location</label>

                    <input
                        type="text"
                        name="location"
                        class="custom-input"
                        value="{{ book.location }}"
                        required>

                </div>


                <div class="button-row">

                    <a
                        href="{% url 'books_list' %}"
                        class="btn btn-secondary cancel-btn">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="update-btn">

                        💾 Update Book

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
