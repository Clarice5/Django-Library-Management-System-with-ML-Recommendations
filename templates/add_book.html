<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>
</head>
<body>

    <h1>Add Book</h1>

    <form method="GET">

        <label for="isbn">Enter ISBN:</label><br><br>

        <input
            type="text"
            id="isbn"
            name="isbn"
            placeholder="Enter ISBN">

        <br><br>

        <button type="submit">
            Fetch Details
        </button>

    </form>
    {%if title%}
    <table border="1">
    <tr>
        <th>Title</th>
        <td>{{ title }}</td>
    </tr>

    <tr>
        <th>Author</th>
        <td>{{ author }}</td>
    </tr>

    <tr>
        <th>Publisher</th>
        <td>{{ publisher }}</td>
    </tr>

    <tr>
        <th>Publish Date</th>
        <td>{{ publish_date }}</td>
    </tr>
    </table>
    <form method="POST">

    {% csrf_token %}
    <input type="hidden" name="title" value="{{ title }}">
    <input type="hidden" name="author" value="{{ author }}">
    <input type="hidden" name="isbn" value="{{ isbn }}">

    <label>Category:</label>
    <input type="text" name="category" required>

    <br><br>

    <label>Location:</label>
    <input type="text" name="location" required>

    <br><br>

    <button type="submit">Save Book</button>

</form>
    {%endif%}
    
</body>
</html>
