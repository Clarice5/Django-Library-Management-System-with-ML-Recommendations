{% extends 'base.html' %}

{% block title %}Review Book{% endblock %}

{% block body %}

<style>

    .review-container {
        max-width: 650px;
        margin: 55px auto;
    }

    .review-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .review-header h2 {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .review-header p {
        color: rgba(255,255,255,0.6);
    }

    .review-card {
        background: rgba(255,255,255,0.06);

        border: 1px solid rgba(255,255,255,0.12);

        border-radius: 20px;

        padding: 35px;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        box-shadow:
            0 15px 35px rgba(0,0,0,0.25);
    }

    .book-name {
        color: white;
        font-weight: 600;
    }

    .form-group-custom {
        margin-bottom: 22px;
    }

    .form-group-custom label {
        display: block;
        margin-bottom: 8px;

        color: rgba(255,255,255,0.75);

        font-size: 14px;
    }

    .custom-select,
    .custom-textarea {

        width: 100%;

        background: rgba(255,255,255,0.07);

        border: 1px solid rgba(255,255,255,0.15);

        border-radius: 10px;

        color: white;

        padding: 12px 14px;
    }

    .custom-select {
        height: 48px;
    }

    .custom-textarea {
        resize: vertical;
        min-height: 130px;
    }

    .custom-select:focus,
    .custom-textarea:focus {

        outline: none;

        border-color: rgba(255,255,255,0.4);

        background: rgba(255,255,255,0.10);

        box-shadow: none;
    }

    .custom-select option {
        background: #252525;
        color: white;
    }

    .custom-textarea::placeholder {
        color: rgba(255,255,255,0.4);
    }

    .review-btn {

        width: 100%;

        height: 48px;

        border: none;

        border-radius: 10px;

        background: white;

        color: #111827;

        font-weight: 600;

        transition: 0.25s;
    }

    .review-btn:hover {

        transform: translateY(-2px);

        box-shadow:
            0 8px 20px rgba(0,0,0,0.25);
    }

    .cancel-link {

        display: block;

        text-align: center;

        margin-top: 15px;

        color: rgba(255,255,255,0.55);

        text-decoration: none;
    }

    .cancel-link:hover {
        color: white;
        text-decoration: none;
    }

</style>


<div class="container page-container">

    <div class="review-container">

        <div class="review-header">

            <h2>⭐ Review This Book</h2>

            <p>
                Share your thoughts about
                <span class="book-name">
                    "{{ book.title }}"
                </span>
            </p>

        </div>


        <div class="review-card">

            <form method="POST">

                {% csrf_token %}


                <!-- RATING -->

                <div class="form-group-custom">

                    <label for="rating">
                        Your Rating
                    </label>

                    <select
                        name="rating"
                        id="rating"
                        class="custom-select"
                        required>

                        <option value="">
                            Select a rating
                        </option>

                        <option value="5">
                            ⭐⭐⭐⭐⭐ — Excellent
                        </option>

                        <option value="4">
                            ⭐⭐⭐⭐ — Good
                        </option>

                        <option value="3">
                            ⭐⭐⭐ — Average
                        </option>

                        <option value="2">
                            ⭐⭐ — Not great
                        </option>

                        <option value="1">
                            ⭐ — Poor
                        </option>

                    </select>

                </div>


                <!-- COMMENT -->

                <div class="form-group-custom">

                    <label for="comment">
                        Your Review
                    </label>

                    <textarea
                        name="comment"
                        id="comment"
                        class="custom-textarea"
                        placeholder="What did you think about this book?"
                        required></textarea>

                </div>


                <button
                    type="submit"
                    class="review-btn">

                    ⭐ Submit Review

                </button>


                <a
                    href="{% url 'books_list' %}"
                    class="cancel-link">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
