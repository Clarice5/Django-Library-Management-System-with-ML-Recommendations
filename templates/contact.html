{% extends 'base.html' %}

{% block title %}CONTACT US!{% endblock title %}

{% block body %}
<div class="container my-4">
  <!-- Banner Image -->
  <img src="https://picsum.photos/id/1/1600/500" class="d-block w-100 mb-4 rounded" alt="Banner Image">
  
  <!-- Contact Section -->
  <div class="p-4 shadow-sm rounded" style="background-color: #e9ecef; font-family: Calibri, Arial, sans-serif;">
    <h3 class="text-center mb-4">Contact Us</h3>
    
    <form method="post" action="/contact">
      {% csrf_token %}
      
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control rounded-3" id="name" name="name" placeholder="Enter your name">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control rounded-3" id="email" name="email" placeholder="name@example.com">
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Contact Number</label>
        <input type="tel" class="form-control rounded-3" id="phone" name="phone" placeholder="Your number">
      </div>

      <div class="mb-4">
        <label for="desc" class="form-label">Reason</label>
        <textarea class="form-control rounded-3" id="desc" name="desc" rows="4" placeholder="How can we help you?"></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary px-4 py-2 rounded-pill">Submit</button>
      </div>
    </form>
  </div>
</div>
{% endblock body %}
